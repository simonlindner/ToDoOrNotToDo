<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" class="dark">

<head>
    <meta charset="UTF-8">
    <title>ToDoOrNotToDo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0a0a0a',
                            white: '#fcfcfc',
                            cardDark: '#171717',
                            cardLight: '#ffffff',
                            borderDark: '#262626',
                            borderLight: '#e5e5e5'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .perspective {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .flipped {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body
    class="bg-brand-white dark:bg-brand-black text-brand-black dark:text-brand-white min-h-screen transition-colors duration-200 font-sans">

    <!-- Header -->
    <header
        class="border-b border-brand-borderLight dark:border-brand-borderDark sticky top-0 bg-brand-white/80 dark:bg-brand-black/80 backdrop-blur-md z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">

            <a href="/" class="text-xl font-bold tracking-tight border-b-2 border-current pb-0.5">ToDoOrNotToDo</a>

            <!-- Suchfeld mit fehlerhafter Rot-Hervorhebung -->
            <form action="/" method="get" class="flex-1 max-w-sm">
                <div class="relative">
                    <input type="text" name="city" th:value="${cityInput}" placeholder="Stadt suchen..."
                        class="w-full bg-transparent border rounded-full px-4 py-1.5 text-sm focus:outline-none transition-all"
                        th:classappend="${invalidCity} ? 'border-red-500 text-red-500 focus:ring-1 focus:ring-red-500' : 'border-brand-borderLight dark:border-brand-borderDark focus:ring-1 focus:ring-current'">
                </div>
            </form>

            <div class="flex items-center gap-2">
                <button onclick="toggleMapModal()"
                    class="border border-brand-borderLight dark:border-brand-borderDark rounded-full px-3 py-1.5 text-xs hover:bg-neutral-100 dark:hover:bg-neutral-900 transition">
                    📍 Karte
                </button>
                <button onclick="toggleDarkMode()"
                    class="border border-brand-borderLight dark:border-brand-borderDark rounded-full p-1.5 text-xs w-8 h-8 flex items-center justify-center hover:bg-neutral-100 dark:hover:bg-neutral-900 transition">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <div
            class="mb-6 flex justify-between items-baseline border-b border-brand-borderLight dark:border-brand-borderDark pb-2">
            <h2 class="text-lg font-medium" th:text="'Vorhersage für ' + ${locationName}">Standort</h2>
            <span class="text-xs text-neutral-500">Klicke auf eine Karte zum Umdrehen</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

            <!-- 1. Vorhandene Aktivitäts-Karten -->
            <div th:each="actMatch : ${activityMatches}" class="perspective h-80 cursor-pointer"
                onclick="this.querySelector('.card-inner').classList.toggle('flipped')">

                <div
                    class="card-inner relative w-full h-full duration-500 transform-style-3d transition-transform rounded-xl border border-brand-borderLight dark:border-brand-borderDark bg-brand-cardLight dark:bg-brand-cardDark">

                    <!-- VORDERSEITE -->
                    <div class="absolute inset-0 p-5 backface-hidden flex flex-col justify-between"
                        th:classappend="${!actMatch.hasPossibleDays} ? 'opacity-40 hover:opacity-70 transition-opacity' : ''">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg leading-tight" th:text="${actMatch.activity.name}">
                                    Aktivität</h3>
                                <span class="text-xs px-2 py-0.5 border border-current rounded-full"
                                    th:text="${actMatch.activity.isIndoor} ? 'Indoor' : 'Outdoor'">Typ</span>
                            </div>
                            <p class="text-xs text-neutral-500"
                                th:text="${actMatch.hasPossibleDays} ? 'Diese Woche möglich' : 'Aktuell nicht empfohlen'">
                                Status</p>
                        </div>

                        <div class="space-y-1.5">
                            <div th:each="day : ${actMatch.dayResults}"
                                class="flex items-center justify-between text-xs">
                                <span th:text="${#temporals.format(day.date, 'EE, dd.')}"
                                    class="text-neutral-400">Mo</span>
                                <span class="font-mono" th:text="${day.maxTemp + '°C'}">20°C</span>
                                <span th:if="${day.isPossible}" class="text-emerald-500 font-bold">✓</span>
                                <span th:if="${!day.isPossible}" class="text-neutral-500">✕</span>
                            </div>
                        </div>

                        <div
                            class="text-right text-[10px] text-neutral-400 border-t border-neutral-200 dark:border-neutral-800 pt-2">
                            Klicken für Details ↺
                        </div>
                    </div>

                    <!-- RÜCKSEITE -->
                    <!-- RÜCKSEITE DER AKTIVITÄTS-KARTE -->
                    <div
                        class="absolute inset-0 p-5 backface-hidden rotate-y-180 bg-brand-black text-brand-white dark:bg-brand-white dark:text-brand-black rounded-xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center border-b border-current pb-2 mb-3">
                                <h4 class="font-bold text-sm" th:text="${actMatch.activity.name}">Regeln</h4>

                                <!-- Löschen-Button mit Formular & Bestätigung -->
                                <form th:action="@{/activities/{id}/delete(id=${actMatch.activity.id})}" method="post"
                                    th:onsubmit="return confirm('Möchtest du \'' + [[${actMatch.activity.name}]] + '\' wirklich löschen?');"
                                    onclick="event.stopPropagation();">
                                    <button type="submit"
                                        class="text-xs text-red-500 hover:text-red-400 font-bold px-2 py-1 rounded border border-red-500/30 hover:border-red-500 transition">
                                        🗑️ Löschen
                                    </button>
                                </form>
                            </div>

                            <div class="space-y-2 text-xs">
                                <div class="flex justify-between">
                                    <span>Min. Temperatur:</span>
                                    <span class="font-mono"
                                        th:text="${actMatch.activity.minTemp != null ? actMatch.activity.minTemp + ' °C' : 'Keine'}">15°C</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Max. Temperatur:</span>
                                    <span class="font-mono"
                                        th:text="${actMatch.activity.maxTemp != null ? actMatch.activity.maxTemp + ' °C' : 'Keine'}">30°C</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Sonne erforderlich:</span>
                                    <span
                                        th:text="${actMatch.activity.requiresSunlight ? 'Ja (max 30% Regen)' : 'Nein'}">Ja</span>
                                </div>
                            </div>
                        </div>

                        <div
                            class="border-t border-neutral-700 dark:border-neutral-300 pt-2 text-[11px] text-neutral-400 dark:text-neutral-600">
                            <strong>Auswertung:</strong>
                            <p th:text="${actMatch.reasonSummary}">Begründung.</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 2. LETZTE KARTE: Gestrichelte "+ Aktivität hinzufügen" Flip-Karte -->
            <div class="perspective h-80">
                <div id="addCardInner"
                    class="card-inner relative w-full h-full duration-500 transform-style-3d transition-transform rounded-xl border-2 border-dashed border-neutral-300 dark:border-neutral-700 hover:border-current transition-colors">

                    <!-- VORDERSEITE: Gestrichelt mit Plus -->
                    <div onclick="flipAddCard(true)"
                        class="absolute inset-0 backface-hidden flex flex-col items-center justify-center cursor-pointer p-6 text-center">
                        <button type="button" onclick="toggleModal(true)"
                            class="w-12 h-12 rounded-full bg-brand-black text-brand-white dark:bg-brand-white dark:text-brand-black hover:scale-105 active:scale-95 transition-all shadow-lg flex items-center justify-center">
                            <!-- SVG Icon statt Text-Plus für exakte Zentrierung -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 stroke-current" fill="none"
                                viewBox="0 0 24 24" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                        </button>
                        <br>
                        <span class="font-bold text-sm">Aktivität hinzufügen</span>
                    </div>

                    <!-- RÜCKSEITE: Formular -->
                    <div
                        class="absolute inset-0 p-5 backface-hidden rotate-y-180 bg-brand-cardLight dark:bg-brand-cardDark rounded-xl border border-brand-borderLight dark:border-brand-borderDark flex flex-col justify-between">
                        <div
                            class="flex justify-between items-center border-b border-brand-borderLight dark:border-brand-borderDark pb-2">
                            <h3 class="font-bold text-xs">Neue Aktivität</h3>
                            <button type="button" onclick="flipAddCard(false)"
                                class="text-xs text-neutral-400 hover:text-current">✕ Abbrechen</button>
                        </div>

                        <form action="/activities" method="post"
                            class="space-y-2.5 text-xs flex-1 flex flex-col justify-between mt-3">
                            <div class="space-y-2">
                                <div>
                                    <input type="text" name="name" required placeholder="Name (z.B. Volleyball)"
                                        class="w-full bg-transparent border border-brand-borderLight dark:border-brand-borderDark rounded p-1.5 focus:outline-none">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" name="minTemp" placeholder="Min °C"
                                        class="w-full bg-transparent border border-brand-borderLight dark:border-brand-borderDark rounded p-1.5 focus:outline-none">
                                    <input type="number" name="maxTemp" placeholder="Max °C"
                                        class="w-full bg-transparent border border-brand-borderLight dark:border-brand-borderDark rounded p-1.5 focus:outline-none">
                                </div>
                                <div class="flex items-center gap-2 pt-1">
                                    <input type="checkbox" name="requiresSunlight" id="cardSun" class="rounded">
                                    <label for="cardSun">Sonne nötig</label>
                                </div>
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" name="isIndoor" id="cardIndoor" class="rounded">
                                    <label for="cardIndoor">Indoor</label>
                                </div>
                            </div>

                            <button type="submit"
                                class="w-full bg-brand-black text-brand-white dark:bg-brand-white dark:text-brand-black py-2 rounded font-bold text-xs">
                                Speichern
                            </button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Modal: Map Picker -->
    <div id="mapModal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div
            class="bg-brand-white dark:bg-brand-black border border-brand-borderLight dark:border-brand-borderDark rounded-xl w-full max-w-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm">Ort auf der Karte anklicken</h3>
                <button onclick="toggleMapModal()"
                    class="text-xs px-2 py-1 border border-current rounded">Schließen</button>
            </div>

            <div id="map" class="h-80 rounded-lg border border-brand-borderLight dark:border-brand-borderDark"></div>

            <form action="/" method="get" class="mt-3 grid grid-cols-2 gap-3">
                <input type="hidden" id="latInput" name="lat">
                <input type="hidden" id="lonInput" name="lon">
                <input type="hidden" id="useNearestCityInput" name="useNearestCity" value="false">

                <button type="submit" id="btnNearest"
                    onclick="document.getElementById('useNearestCityInput').value='true'"
                    class="bg-brand-black text-brand-white dark:bg-brand-white dark:text-brand-black py-2 rounded-lg text-xs font-bold disabled:opacity-50"
                    disabled>
                    Nächsten Ort wählen
                </button>

                <button type="submit" id="btnCoords"
                    onclick="document.getElementById('useNearestCityInput').value='false'"
                    class="border border-brand-borderLight dark:border-brand-borderDark py-2 rounded-lg text-xs font-bold disabled:opacity-50"
                    disabled>
                    Exakte Koordinaten wählen
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function flipAddCard(showForm) {
            var inner = document.getElementById('addCardInner');
            if (showForm) {
                inner.classList.add('flipped');
            } else {
                inner.classList.remove('flipped');
            }
        }

        var mapInitialized = false;
        var map, marker;

        function toggleMapModal() {
            var modal = document.getElementById('mapModal');
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden') && !mapInitialized) {
                var lat = /*[[${selectedLat}]]*/ 50.9375;
                var lon = /*[[${selectedLon}]]*/ 6.9603;

                map = L.map('map').setView([lat, lon], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                marker = L.marker([lat, lon]).addTo(map);

                map.on('click', function (e) {
                    marker.setLatLng(e.latlng);
                    document.getElementById('latInput').value = e.latlng.lat;
                    document.getElementById('lonInput').value = e.latlng.lng;

                    document.getElementById('btnNearest').disabled = false;
                    document.getElementById('btnCoords').disabled = false;
                });
                mapInitialized = true;
            }
        }
    </script>
</body>

</html>
